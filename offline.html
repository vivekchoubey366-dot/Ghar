<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <meta name="theme-color" content="#162d25">
  <meta name="description"
        content="GHAR is temporarily unavailable because your device is offline.">

  <title>You're Offline -- GHAR</title>

  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/reset.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/layout.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/responsive.css">
  <link rel="stylesheet" href="/assets/css/animations.css">

  <style>
    :root {
      --offline-green: #162d25;
      --offline-green-2: #24483b;
      --offline-cream: #f6f0e5;
      --offline-gold: #c9a96e;
      --offline-text: #24332d;
      --offline-muted: #6f7c76;
      --offline-border: rgba(22,45,37,.12);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      color: var(--offline-text);
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background:
        radial-gradient(
          circle at 15% 10%,
          rgba(201,169,110,.22),
          transparent 30%
        ),
        radial-gradient(
          circle at 90% 85%,
          rgba(36,72,59,.16),
          transparent 32%
        ),
        linear-gradient(
          135deg,
          #f8f2e8 0%,
          #eee6d8 48%,
          #e5eee8 100%
        );
    }

    .offline-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .offline-header {
      width: 100%;
      padding: 22px clamp(18px,5vw,70px);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .ghar-logo {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      color: var(--offline-green);
      text-decoration: none;
      font-weight: 900;
      letter-spacing: .08em;
      font-size: 1.25rem;
    }

    .ghar-logo-mark {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      color: #fff;
      background:
        linear-gradient(
          145deg,
          var(--offline-green),
          var(--offline-green-2)
        );
      box-shadow: 0 12px 30px rgba(22,45,37,.20);
    }

    .offline-status {
      padding: 9px 14px;
      border: 1px solid var(--offline-border);
      border-radius: 999px;
      background: rgba(255,255,255,.48);
      color: var(--offline-muted);
      font-size: .82rem;
      font-weight: 700;
    }

    .offline-main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 30px 20px 70px;
    }

    .offline-card {
      width: min(720px, 100%);
      text-align: center;
      padding: clamp(34px,7vw,72px);
      border: 1px solid rgba(255,255,255,.75);
      border-radius: 34px;
      background: rgba(255,255,255,.54);
      box-shadow:
        0 30px 80px rgba(22,45,37,.12),
        inset 0 1px 0 rgba(255,255,255,.9);
      backdrop-filter: blur(18px);
    }

    .offline-icon {
      width: 94px;
      height: 94px;
      margin: 0 auto 28px;
      border-radius: 30px;
      display: grid;
      place-items: center;
      font-size: 2.5rem;
      background: var(--offline-green);
      color: #fff;
      box-shadow: 0 20px 45px rgba(22,45,37,.20);
    }

    .offline-card h1 {
      margin: 0 0 15px;
      color: var(--offline-green);
      font-size: clamp(2rem,5vw,3.5rem);
      line-height: 1.08;
      letter-spacing: -.045em;
    }

    .offline-card p {
      max-width: 560px;
      margin: 0 auto;
      color: var(--offline-muted);
      font-size: 1.05rem;
      line-height: 1.75;
    }

    .offline-actions {
      margin-top: 32px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .offline-btn {
      min-height: 48px;
      padding: 0 22px;
      border-radius: 14px;
      border: 1px solid transparent;
      cursor: pointer;
      font: inherit;
      font-weight: 800;
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .offline-btn:hover {
      transform: translateY(-2px);
    }

    .offline-btn.primary {
      color: #fff;
      background: var(--offline-green);
      box-shadow: 0 12px 28px rgba(22,45,37,.20);
    }

    .offline-btn.secondary {
      color: var(--offline-green);
      border-color: var(--offline-border);
      background: rgba(255,255,255,.62);
    }

    .offline-tip {
      margin-top: 30px;
      padding-top: 24px;
      border-top: 1px solid var(--offline-border);
      color: var(--offline-muted);
      font-size: .9rem;
    }

    .offline-footer {
      padding: 20px;
      text-align: center;
      color: var(--offline-muted);
      font-size: .82rem;
    }

    @media (max-width: 600px) {
      .offline-header {
        padding: 18px;
      }

      .offline-status {
        display: none;
      }

      .offline-main {
        padding: 20px 14px 40px;
      }

      .offline-card {
        border-radius: 26px;
        padding: 36px 22px;
      }

      .offline-icon {
        width: 78px;
        height: 78px;
        border-radius: 24px;
      }

      .offline-actions {
        flex-direction: column;
      }

      .offline-btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<div class="offline-page">

  <header class="offline-header">
    <a class="ghar-logo" href="/">
      <span class="ghar-logo-mark">G</span>
      <span>GHAR</span>
    </a>

    <div class="offline-status">
      ● Connection unavailable
    </div>
  </header>

  <main class="offline-main">
    <section class="offline-card" aria-labelledby="offline-title">

      <div class="offline-icon" aria-hidden="true">
        ☁
      </div>

      <h1 id="offline-title">
        You're offline
      </h1>

      <p>
        GHAR needs an internet connection to load the latest properties,
        messages, visits, payments and account information.
      </p>

      <div class="offline-actions">
        <button
          class="offline-btn primary"
          type="button"
          onclick="window.location.reload()">
          Try Again
        </button>

        <a
          class="offline-btn secondary"
          href="/"
          style="display:inline-flex;align-items:center;justify-content:center;text-decoration:none;">
          Go to GHAR
        </a>
      </div>

      <div class="offline-tip">
        Check your Wi-Fi or mobile-data connection and try again.
      </div>

    </section>
  </main>

  <footer class="offline-footer">
    © <span id="year"></span> GHAR. All rights reserved.
  </footer>

</div>

<script>
  document.getElementById("year").textContent = new Date().getFullYear();

  window.addEventListener("online", function () {
    window.location.reload();
  });
</script>

</body>
</html>
