<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <meta name="theme-color" content="#162d25">
  <meta name="description"
        content="The request could not be understood by GHAR.">

  <title>400 -- Bad Request | GHAR</title>

  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/reset.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/layout.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/responsive.css">
  <link rel="stylesheet" href="/assets/css/animations.css">

  <style>
    :root {
      --ghar-green: #162d25;
      --ghar-green-2: #24483b;
      --ghar-cream: #f6f0e5;
      --ghar-gold: #c9a96e;
      --ghar-text: #24332d;
      --ghar-muted: #6f7c76;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ghar-text);
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:
        radial-gradient(
          circle at 10% 15%,
          rgba(201,169,110,.22),
          transparent 30%
        ),
        radial-gradient(
          circle at 90% 80%,
          rgba(36,72,59,.18),
          transparent 34%
        ),
        linear-gradient(
          135deg,
          #faf4e9,
          #eee7da 50%,
          #e4eee8
        );
    }

    .error-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .error-header {
      padding: 22px clamp(18px,5vw,70px);
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      text-decoration: none;
      color: var(--ghar-green);
      font-weight: 900;
      letter-spacing: .08em;
      font-size: 1.25rem;
    }

    .logo-mark {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      color: #fff;
      background:
        linear-gradient(
          145deg,
          var(--ghar-green),
          var(--ghar-green-2)
        );
      box-shadow: 0 12px 30px rgba(22,45,37,.20);
    }

    .error-main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 30px 18px 70px;
    }

    .error-card {
      width: min(760px,100%);
      text-align: center;
      padding: clamp(36px,7vw,76px);
      border-radius: 34px;
      background: rgba(255,255,255,.57);
      border: 1px solid rgba(255,255,255,.78);
      box-shadow:
        0 30px 80px rgba(22,45,37,.13),
        inset 0 1px 0 rgba(255,255,255,.95);
      backdrop-filter: blur(18px);
    }

    .error-code {
      display: block;
      margin-bottom: 10px;
      color: var(--ghar-gold);
      font-size: clamp(4.5rem,13vw,8rem);
      font-weight: 950;
      line-height: .9;
      letter-spacing: -.08em;
    }

    .error-card h1 {
      margin: 0 0 16px;
      color: var(--ghar-green);
      font-size: clamp(1.8rem,4vw,2.8rem);
      letter-spacing: -.04em;
    }

    .error-card p {
      max-width: 570px;
      margin: 0 auto;
      color: var(--ghar-muted);
      font-size: 1.02rem;
      line-height: 1.75;
    }

    .error-actions {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .error-btn {
      min-height: 48px;
      padding: 0 22px;
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-weight: 800;
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .error-btn:hover {
      transform: translateY(-2px);
    }

    .error-btn.primary {
      color: #fff;
      background: var(--ghar-green);
      box-shadow: 0 12px 28px rgba(22,45,37,.20);
    }

    .error-btn.secondary {
      color: var(--ghar-green);
      border: 1px solid rgba(22,45,37,.13);
      background: rgba(255,255,255,.60);
    }

    .error-help {
      margin-top: 30px;
      padding-top: 22px;
      border-top: 1px solid rgba(22,45,37,.10);
      color: var(--ghar-muted);
      font-size: .88rem;
    }

    .error-footer {
      padding: 20px;
      text-align: center;
      color: var(--ghar-muted);
      font-size: .82rem;
    }

    @media (max-width:600px) {
      .error-header {
        padding: 18px;
      }

      .error-main {
        padding: 20px 14px 40px;
      }

      .error-card {
        border-radius: 26px;
        padding: 40px 22px;
      }

      .error-actions {
        flex-direction: column;
      }

      .error-btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<div class="error-page">

  <header class="error-header">
    <a href="/" class="logo">
      <span class="logo-mark">G</span>
      <span>GHAR</span>
    </a>
  </header>

  <main class="error-main">

    <section class="error-card" aria-labelledby="error-title">

      <span class="error-code">400</span>

      <h1 id="error-title">
        Bad Request
      </h1>

      <p>
        GHAR could not understand the request. The address, submitted
        information, or request format may be invalid. Please try again
        or return to the GHAR home page.
      </p>

      <div class="error-actions">

        <a href="/" class="error-btn primary">
          Go to Home
        </a>

        <a href="javascript:history.back()" class="error-btn secondary">
          Go Back
        </a>

      </div>

      <div class="error-help">
        If this keeps happening, visit
        <a
          href="/help.html"
          style="color:var(--ghar-green);font-weight:800;">
          GHAR Help Centre
        </a>
        for assistance.
      </div>

    </section>

  </main>

  <footer class="error-footer">
    © <span id="year"></span> GHAR. All rights reserved.
  </footer>

</div>

<script>
  document.getElementById("year").textContent = new Date().getFullYear();
</script>

</body>
</html>
