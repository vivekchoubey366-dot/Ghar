<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="description" content="GHAR Admin -- Edit property listing.">
<meta name="theme-color" content="#162d25">

<title>GHAR · Edit Property</title>

<style>
*{box-sizing:border-box}

:root{
  --dark:#07130e;
  --green:#10251b;
  --green2:#162d25;
  --gold:#e5c77d;
  --gold2:#b98b3d;
  --cream:#fffaf0;
  --muted:#ffffff9c;
  --border:#e5c77d33;
}

body{
  margin:0;
  min-height:100vh;
  color:var(--cream);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 0 0,#e5c77d2e,transparent 25%),
    radial-gradient(circle at 100% 0,#28553f40,transparent 28%),
    linear-gradient(135deg,#cbaa68,#dbc184,#b99752);
}

button,input,select,textarea{font:inherit}

.app{
  min-height:100vh;
  display:grid;
  grid-template-columns:250px 1fr;
}

.sidebar{
  padding:24px 16px;
  background:linear-gradient(180deg,#07130e,#10251b);
  border-right:1px solid var(--border);
}

.logo{
  display:flex;
  gap:12px;
  align-items:center;
  padding:3px 8px 25px;
}

.logo-mark{
  width:45px;
  height:45px;
  display:grid;
  place-items:center;
  border-radius:14px;
  color:#172016;
  font-weight:1000;
  background:linear-gradient(135deg,#f0d99b,#b98b3d);
}

.logo b{letter-spacing:.15em}
.logo small{
  display:block;
  color:#ffffff66;
  font-size:8px;
  letter-spacing:.12em;
}

.nav{
  display:grid;
  gap:5px;
}

.nav a{
  padding:12px;
  border-radius:12px;
  color:#ffffff9b;
  text-decoration:none;
  font-size:12px;
  font-weight:800;
}

.nav a:hover,
.nav a.active{
  color:var(--gold);
  background:#e5c77d12;
}

.main{
  min-width:0;
  padding:28px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:20px;
  margin-bottom:22px;
}

.eyebrow{
  color:var(--gold);
  font-size:10px;
  font-weight:900;
  letter-spacing:.16em;
}

h1{
  margin:7px 0 0;
  font-size:clamp(31px,5vw,48px);
  line-height:1;
  letter-spacing:-.04em;
}

.header-actions{
  display:flex;
  gap:8px;
}

.btn{
  padding:11px 14px;
  border-radius:11px;
  border:1px solid #ffffff16;
  color:#eee;
  background:#091b1270;
  font-size:10px;
  font-weight:900;
  cursor:pointer;
}

.btn.gold{
  border:0;
  color:#17170f;
  background:linear-gradient(135deg,#f1dca1,#b98b3d);
}

.form{
  display:grid;
  gap:17px;
}

.card{
  padding:21px;
  border:1px solid var(--border);
  border-radius:25px;
  background:
    radial-gradient(circle at 100% 0,#e5c77d0c,transparent 28%),
    linear-gradient(145deg,#0a1a12,#10251b 55%,#142d22);
  box-shadow:0 30px 85px #0005;
}

.card-title{
  margin:0 0 15px;
  font-size:14px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.field{
  display:grid;
  gap:7px;
}

.field.full{
  grid-column:1/-1;
}

label{
  color:#ffffffc2;
  font-size:10px;
  font-weight:800;
}

input,select,textarea{
  width:100%;
  border:1px solid #ffffff12;
  border-radius:12px;
  padding:12px 13px;
  outline:0;
  color:#fffaf0;
  background:#020d08a6;
}

select option{color:#111}

textarea{
  min-height:125px;
  resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#e5c77d99;
  box-shadow:0 0 0 3px #e5c77d10;
}

.preview{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
}

.photo{
  min-height:110px;
  display:grid;
  place-items:center;
  border:1px dashed #e5c77d3c;
  border-radius:13px;
  color:#ffffff55;
  background:#ffffff04;
  font-size:25px;
}

.form-footer{
  display:flex;
  justify-content:flex-end;
  gap:9px;
  padding-bottom:30px;
}

.status{
  display:none;
  margin-top:13px;
  padding:11px 13px;
  border-radius:11px;
  color:#c9f0d3;
  background:#4ca86512;
  border:1px solid #69c58625;
  font-size:10px;
}

.status.show{display:block}

@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{padding:18px}
  .nav{display:flex;overflow:auto}
}

@media(max-width:650px){
  .main{padding:17px}
  .header{display:block}
  .header-actions{margin-top:15px}
  .grid{grid-template-columns:1fr}
  .field.full{grid-column:auto}
  .preview{grid-template-columns:repeat(2,1fr)}
  .form-footer{justify-content:stretch}
  .form-footer .btn{flex:1}
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">

<div class="logo">
<div class="logo-mark">G</div>
<div>
<b>GHAR</b>
<small>ADMINISTRATION</small>
</div>
</div>

<nav class="nav">
<a href="/admin/admin-dashboard.html">Dashboard</a>
<a href="/admin/list-property.html" class="active">Properties</a>
<a href="/admin/property-approval.html">Approvals</a>
<a href="/admin/admin-documents.html">Documents</a>
<a href="/admin/admin-payments.html">Payments</a>
<a href="/admin/control-center.html">Control Center</a>
</nav>

</aside>

<main class="main">

<header class="header">

<div>
<div class="eyebrow">PROPERTY MANAGEMENT</div>
<h1>Edit property.</h1>
</div>

<div class="header-actions">
<button class="btn" onclick="history.back()">Cancel</button>
<button class="btn gold" onclick="saveProperty()">Save changes</button>
</div>

</header>

<form id="propertyForm" class="form">

<section class="card">

<h2 class="card-title">Property information</h2>

<div class="grid">

<div class="field">
<label for="propertyId">Property ID</label>
<input id="propertyId" name="propertyId" value="GHAR-P001" readonly>
</div>

<div class="field">
<label for="status">Listing status</label>
<select id="status" name="status">
<option>Draft</option>
<option selected>Approved</option>
<option>Pending</option>
<option>Rejected</option>
</select>
</div>

<div class="field">
<label for="title">Property title</label>
<input id="title" name="title" value="Luxury 3 BHK Apartment" required>
</div>

<div class="field">
<label for="propertyType">Property type</label>
<select id="propertyType">
<option selected>Apartment</option>
<option>Villa</option>
<option>Independent House</option>
<option>Plot</option>
<option>Commercial</option>
</select>
</div>

<div class="field">
<label for="purpose">Purpose</label>
<select id="purpose">
<option selected>Sale</option>
<option>Rent</option>
<option>Lease</option>
</select>
</div>

<div class="field">
<label for="price">Price</label>
<input id="price" value="18500000" inputmode="decimal">
</div>

</div>

</section>

<section class="card">

<h2 class="card-title">Location</h2>

<div class="grid">

<div class="field">
<label for="address">Address</label>
<input id="address" value="Sector 150, Noida">
</div>

<div class="field">
<label for="city">City</label>
<input id="city" value="Noida">
</div>

<div class="field">
<label for="state">State</label>
<input id="state" value="Uttar Pradesh">
</div>

<div class="field">
<label for="pincode">Pincode</label>
<input id="pincode" value="201301" inputmode="numeric">
</div>

</div>

</section>

<section class="card">

<h2 class="card-title">Property specifications</h2>

<div class="grid">

<div class="field">
<label for="bedrooms">Bedrooms</label>
<input id="bedrooms" value="3" inputmode="numeric">
</div>

<div class="field">
<label for="bathrooms">Bathrooms</label>
<input id="bathrooms" value="3" inputmode="numeric">
</div>

<div class="field">
<label for="area">Built-up area</label>
<input id="area" value="1850 sq ft">
</div>

<div class="field">
<label for="floor">Floor</label>
<input id="floor" value="12">
</div>

<div class="field full">
<label for="description">Description</label>
<textarea id="description">Premium 3 BHK apartment with spacious living areas, modern interiors and excellent connectivity.</textarea>
</div>

</div>

</section>

<section class="card">

<h2 class="card-title">Property media</h2>

<div class="preview">
<div class="photo">📷</div>
<div class="photo">📷</div>
<div class="photo">📷</div>
<div class="photo">＋</div>
</div>

</section>

<section class="card">

<h2 class="card-title">Verification information</h2>

<div class="grid">

<div class="field">
<label for="ownership">Ownership verification</label>
<select id="ownership">
<option selected>Verified</option>
<option>Pending</option>
<option>Rejected</option>
</select>
</div>

<div class="field">
<label for="propertyVerification">Property verification</label>
<select id="propertyVerification">
<option selected>Verified</option>
<option>Pending</option>
<option>Rejected</option>
</select>
</div>

</div>

<div id="statusMessage" class="status"></div>

</section>

<div class="form-footer">
<button type="button" class="btn" onclick="history.back()">Cancel</button>
<button type="button" class="btn gold" onclick="saveProperty()">Save property</button>
</div>

</form>

</main>
</div>

<script>
const API_BASE=window.GHAR_API_BASE||window.API_BASE||"/api";

function getPropertyId(){
  const params=new URLSearchParams(location.search);
  return params.get("id");
}

function saveProperty(){

  const payload={
    propertyId:document.getElementById("propertyId").value,
    title:document.getElementById("title").value.trim(),
    status:document.getElementById("status").value,
    propertyType:document.getElementById("propertyType").value,
    purpose:document.getElementById("purpose").value,
    price:document.getElementById("price").value,
    address:document.getElementById("address").value.trim(),
    city:document.getElementById("city").value.trim(),
    state:document.getElementById("state").value.trim(),
    pincode:document.getElementById("pincode").value.trim(),
    bedrooms:document.getElementById("bedrooms").value,
    bathrooms:document.getElementById("bathrooms").value,
    area:document.getElementById("area").value,
    floor:document.getElementById("floor").value,
    description:document.getElementById("description").value,
    ownershipVerification:document.getElementById("ownership").value,
    propertyVerification:document.getElementById("propertyVerification").value
  };

  const status=document.getElementById("statusMessage");

  status.textContent="Saving property changes...";
  status.classList.add("show");

  fetch(
    API_BASE+"/admin/properties/"+encodeURIComponent(payload.propertyId),
    {
      method:"PUT",
      credentials:"include",
      headers:{
        "Content-Type":"application/json",
        "Accept":"application/json"
      },
      body:JSON.stringify(payload)
    }
  )
  .then(async response=>{
    if(!response.ok){
      let data={};
      try{data=await response.json()}catch(e){}
      throw new Error(
        data.message||
        data.error||
        "Unable to save property."
      );
    }

    return response.json().catch(()=>({}));
  })
  .then(data=>{
    status.textContent=
      data.message||
      "Property changes saved successfully.";
  })
  .catch(error=>{
    /*
      Keep the interface usable even when the API
      has not yet been connected.
    */
    console.warn("GHAR property API:",error);

    status.textContent=
      "Changes prepared. Connect the GHAR property API to persist them.";
  });
}

const id=getPropertyId();

if(id){
  document.getElementById("propertyId").value=id;
}
</script>

</body>
</html>
