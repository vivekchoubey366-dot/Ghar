<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <meta name="theme-color" content="#162d25">
  <meta
    name="description"
    content="The page you're looking for could not be found on GHAR."
  >

  <title>404 -- Page Not Found | GHAR</title>

  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/reset.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/layout.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/responsive.css">
  <link rel="stylesheet" href="/assets/css/animations.css">

  <style>
    :root {
      --ghar-green: #162d25;
      --ghar-green-2: #24483b;
      --ghar-cream: #f6f0e5;
      --ghar-gold: #c9a96e;
      --ghar-text: #24332d;
      --ghar-muted: #6f7c76;
      --ghar-border: rgba(22,45,37,.12);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      color: var(--ghar-text);
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:
        radial-gradient(
          circle at 12% 12%,
          rgba(201,169,110,.22),
          transparent 30%
        ),
        radial-gradient(
          circle at 88% 82%,
          rgba(36,72,59,.18),
          transparent 34%
        ),
        linear-gradient(
          135deg,
          #faf4e9 0%,
          #eee7da 48%,
          #e3eee7 100%
        );
    }

    .ghar-404 {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */

    .error-header {
      width: 100%;
      padding: 22px clamp(18px,5vw,70px);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .ghar-logo {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      color: var(--ghar-green);
      text-decoration: none;
      font-size: 1.25rem;
      font-weight: 900;
      letter-spacing: .08em;
    }

    .ghar-logo-mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      color: #fff;
      background:
        linear-gradient(
          145deg,
          var(--ghar-green),
          var(--ghar-green-2)
        );
      box-shadow:
        0 12px 30px rgba(22,45,37,.20);
    }

    .header-link {
      color: var(--ghar-green);
      text-decoration: none;
      font-size: .88rem;
      font-weight: 800;
    }

    .header-link:hover {
      text-decoration: underline;
    }

    /* MAIN */

    .error-main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 30px 18px 70px;
    }

    .error-card {
      width: min(820px,100%);
      position: relative;
      overflow: hidden;
      text-align: center;

      padding: clamp(38px,7vw,78px);

      border: 1px solid rgba(255,255,255,.78);
      border-radius: 36px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.68),
          rgba(255,255,255,.42)
        );

      box-shadow:
        0 35px 90px rgba(22,45,37,.13),
        inset 0 1px 0 rgba(255,255,255,.95);

      backdrop-filter: blur(20px);
    }

    .error-decoration {
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      pointer-events: none;
      opacity: .35;
      background:
        radial-gradient(
          circle,
          rgba(201,169,110,.40),
          transparent 70%
        );
    }

    .error-decoration.one {
      top: -100px;
      left: -70px;
    }

    .error-decoration.two {
      right: -80px;
      bottom: -100px;
      background:
        radial-gradient(
          circle,
          rgba(36,72,59,.30),
          transparent 70%
        );
    }

    .error-content {
      position: relative;
      z-index: 1;
    }

    /* ERROR NUMBER */

    .error-number {
      display: block;
      margin-bottom: 10px;

      color: var(--ghar-gold);

      font-size:
        clamp(5rem,16vw,10rem);

      font-weight: 950;
      line-height: .82;
      letter-spacing: -.09em;

      text-shadow:
        0 15px 35px rgba(201,169,110,.18);
    }

    .error-card h1 {
      margin: 0 0 16px;

      color: var(--ghar-green);

      font-size:
        clamp(1.8rem,4vw,3rem);

      line-height: 1.1;
      letter-spacing: -.045em;
    }

    .error-card p {
      width: min(600px,100%);
      margin: 0 auto;

      color: var(--ghar-muted);

      font-size: 1.04rem;
      line-height: 1.75;
    }

    /* SEARCH */

    .error-search {
      width: min(600px,100%);
      margin: 30px auto 0;

      display: flex;
      align-items: center;

      padding: 6px;

      border: 1px solid var(--ghar-border);
      border-radius: 16px;

      background: rgba(255,255,255,.62);
    }

    .error-search input {
      min-width: 0;
      flex: 1;

      height: 46px;
      padding: 0 14px;

      border: 0;
      outline: 0;

      color: var(--ghar-text);
      background: transparent;

      font: inherit;
    }

    .error-search input::placeholder {
      color: #89928d;
    }

    .search-button {
      height: 46px;
      padding: 0 19px;

      border: 0;
      border-radius: 11px;

      color: #fff;
      background: var(--ghar-green);

      cursor: pointer;

      font: inherit;
      font-weight: 800;
    }

    /* ACTIONS */

    .error-actions {
      margin-top: 25px;

      display: flex;
      justify-content: center;
      align-items: center;

      gap: 12px;
      flex-wrap: wrap;
    }

    .error-btn {
      min-height: 48px;
      padding: 0 22px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      border-radius: 14px;

      text-decoration: none;

      font-weight: 800;

      transition:
        transform .2s ease,
        box-shadow .2s ease;
    }

    .error-btn:hover {
      transform: translateY(-2px);
    }

    .error-btn.primary {
      color: #fff;
      background: var(--ghar-green);

      box-shadow:
        0 12px 28px rgba(22,45,37,.20);
    }

    .error-btn.secondary {
      color: var(--ghar-green);

      border: 1px solid var(--ghar-border);

      background: rgba(255,255,255,.60);
    }

    /* QUICK LINKS */

    .quick-links {
      margin-top: 32px;
      padding-top: 24px;

      border-top: 1px solid var(--ghar-border);

      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 9px 20px;
    }

    .quick-links a {
      color: var(--ghar-muted);
      text-decoration: none;

      font-size: .88rem;
      font-weight: 700;
    }

    .quick-links a:hover {
      color: var(--ghar-green);
    }

    /* FOOTER */

    .error-footer {
      padding: 20px;

      text-align: center;

      color: var(--ghar-muted);

      font-size: .82rem;
    }

    /* MOBILE */

    @media (max-width: 600px) {

      .error-header {
        padding: 18px;
      }

      .header-link {
        display: none;
      }

      .error-main {
        padding:
          18px
          14px
          40px;
      }

      .error-card {
        border-radius: 27px;
        padding: 42px 21px;
      }

      .error-number {
        font-size: 6rem;
      }

      .error-search {
        flex-direction: column;
        padding: 7px;
      }

      .error-search input {
        width: 100%;
      }

      .search-button {
        width: 100%;
      }

      .error-actions {
        flex-direction: column;
      }

      .error-btn {
        width: 100%;
      }

      .quick-links {
        gap: 12px 16px;
      }
    }
  </style>
</head>

<body>

<div class="ghar-404">

  <!-- HEADER -->

  <header class="error-header">

    <a href="/" class="ghar-logo" aria-label="GHAR Home">

      <span class="ghar-logo-mark">
        G
      </span>

      <span>
        GHAR
      </span>

    </a>

    <a
      href="/help.html?topic=account"
      class="header-link">
      Need help?
    </a>

  </header>


  <!-- MAIN -->

  <main class="error-main">

    <section
      class="error-card"
      aria-labelledby="error-title">

      <span
        class="error-decoration one"
        aria-hidden="true">
      </span>

      <span
        class="error-decoration two"
        aria-hidden="true">
      </span>


      <div class="error-content">

        <span class="error-number">
          404
        </span>

        <h1 id="error-title">
          We couldn't find that page
        </h1>

        <p>
          The property, page or resource you're looking for may have
          been moved, removed, renamed, or the address may be incorrect.
        </p>


        <!-- SEARCH -->

        <form
          class="error-search"
          id="errorSearch"
          role="search">

          <input
            id="searchInput"
            type="search"
            name="q"
            autocomplete="off"
            placeholder="Search properties, locations or pages..."
            aria-label="Search GHAR">

          <button
            class="search-button"
            type="submit">
            Search
          </button>

        </form>


        <!-- ACTIONS -->

        <div class="error-actions">

          <a
            href="/"
            class="error-btn primary">
            Go to GHAR Home
          </a>

          <a
            href="javascript:history.back()"
            class="error-btn secondary">
            Go Back
          </a>

        </div>


        <!-- QUICK LINKS -->

        <nav
          class="quick-links"
          aria-label="Popular GHAR links">

          <a href="/properties.html">
            Properties
          </a>

          <a href="/map.html">
            Property Map
          </a>

          <a href="/ai-property-search.html">
            GHAR AI Search
          </a>

          <a href="/compare.html">
            Compare
          </a>

          <a href="/help.html">
            Help Centre
          </a>

        </nav>

      </div>

    </section>

  </main>


  <!-- FOOTER -->

  <footer class="error-footer">

    © <span id="year"></span> GHAR.
    All rights reserved.

  </footer>

</div>


<script>
  /* Current year */
  document.getElementById("year").textContent =
    new Date().getFullYear();


  /* GHAR search */
  document
    .getElementById("errorSearch")
    .addEventListener("submit", function (event) {

      event.preventDefault();

      const input =
        document.getElementById("searchInput");

      const query =
        input.value.trim();

      if (!query) {
        input.focus();
        return;
      }

      /*
       * Send the visitor to the main property-search page.
       * The search page can read ?q= from the URL.
       */
      window.location.href =
        "/properties.html?q=" +
        encodeURIComponent(query);
    });
</script>

</body>
</html>
