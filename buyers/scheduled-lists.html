<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="GHAR Buyer Scheduled Visits">
<meta name="theme-color" content="#10231d">
<title>Scheduled Visits · GHAR</title>
<link rel="stylesheet" href="../assets/css/style.css">

<style>
:root{
    --g:#10231d;
    --g2:#18372d;
    --gold:#c9a96e;
    --cream:#f5efe4;
    --sand:#e9dfcf;
    --text:#18221e;
    --muted:#6f776f;
    --border:rgba(16,35,29,.12);
}

body{
    margin:0;
    color:var(--text);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:
        radial-gradient(circle at 5% 0%,rgba(201,169,110,.18),transparent 30%),
        radial-gradient(circle at 95% 20%,rgba(24,55,45,.12),transparent 28%),
        linear-gradient(135deg,#f8f3ea,#e8eee8 52%,#f0e5d5);
}

*{box-sizing:border-box}
a{text-decoration:none;color:inherit}
button{font:inherit;cursor:pointer}

.page{
    width:min(1400px,calc(100% - 32px));
    margin:auto;
    padding:34px 0 70px;
}

.hero{
    padding:34px;
    border-radius:28px;
    color:#fff;
    background:linear-gradient(120deg,var(--g),var(--g2));
    box-shadow:0 20px 60px rgba(16,35,29,.14);
    margin-bottom:22px;
}

.eyebrow{
    color:var(--gold);
    font-size:.72rem;
    font-weight:800;
    letter-spacing:.16em;
}

.hero h1{
    margin:9px 0;
    font-size:clamp(2rem,4vw,3rem);
}

.hero p{
    max-width:700px;
    margin:0;
    color:rgba(255,255,255,.72);
    line-height:1.7;
}

.toolbar,
.card{
    background:rgba(255,255,255,.64);
    border:1px solid var(--border);
    border-radius:21px;
    box-shadow:0 18px 50px rgba(16,35,29,.07);
}

.toolbar{
    padding:18px;
    margin-bottom:18px;
    display:flex;
    justify-content:space-between;
    gap:15px;
    align-items:center;
}

.filters{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.filter{
    border:1px solid var(--border);
    background:rgba(255,255,255,.7);
    border-radius:999px;
    padding:8px 13px;
    font-size:.76rem;
    font-weight:750;
}

.filter.active,
.filter:hover{
    background:var(--g);
    color:#fff;
}

.list{
    display:grid;
    gap:16px;
}

.card{
    padding:20px;
}

.visit{
    display:grid;
    grid-template-columns:110px 1fr auto;
    gap:18px;
    align-items:center;
}

.date{
    border-radius:18px;
    padding:15px;
    text-align:center;
    background:var(--g);
    color:#fff;
}

.date strong{
    display:block;
    color:var(--gold);
    font-size:1.7rem;
}

.date span{
    font-size:.7rem;
    text-transform:uppercase;
    letter-spacing:.08em;
}

.visit h3{margin:0 0 6px}
.muted{color:var(--muted);font-size:.82rem;line-height:1.6}

.status{
    display:inline-block;
    padding:7px 10px;
    border-radius:999px;
    background:#dcebdc;
    color:#285b37;
    font-size:.7rem;
    font-weight:800;
}

.actions{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
}

.btn{
    display:inline-block;
    padding:10px 13px;
    border-radius:11px;
    border:1px solid var(--border);
    background:rgba(255,255,255,.75);
    font-size:.76rem;
    font-weight:750;
}

.btn.primary{
    background:var(--g);
    color:#fff;
    border-color:var(--g);
}

@media(max-width:760px){
    .page{width:calc(100% - 20px);padding-top:18px}
    .hero{padding:25px 21px}
    .toolbar{align-items:flex-start;flex-direction:column}
    .visit{grid-template-columns:80px 1fr}
    .visit .actions{grid-column:1/-1}
}

@media(max-width:480px){
    .visit{grid-template-columns:1fr}
    .date{display:flex;justify-content:center;gap:8px;align-items:center}
}
</style>
</head>

<body data-root="../" data-page="scheduled-lists">

<div data-site-header></div>

<main class="page">

<section class="hero">
    <div class="eyebrow">GHAR BUYER WORKSPACE</div>
    <h1>Scheduled Visits</h1>
    <p>View and manage your upcoming property visits, timings and visit requests from one secure workspace.</p>
</section>

<section class="toolbar">
    <div>
        <strong>Visit Schedule</strong>
        <div class="muted">Your upcoming and previous property visits.</div>
    </div>

    <div class="filters">
        <button class="filter active" data-filter="all">All</button>
        <button class="filter" data-filter="scheduled">Scheduled</button>
        <button class="filter" data-filter="pending">Pending</button>
        <button class="filter" data-filter="completed">Completed</button>
    </div>
</section>

<section id="visitList" class="list"></section>

</main>

<div data-site-footer></div>
<div class="ghar-global-toast"></div>

<script src="../assets/js/main/site.js" defer></script>
<script src="../assets/js/main/page.js" defer></script>

<script>
(function(){

const fallback=[
{
 id:"GHAR-V001",
 day:"12",
 month:"OCT",
 title:"Luxury 3 BHK Residence",
 location:"Sector 150, Noida",
 time:"11:30 AM",
 status:"scheduled"
},
{
 id:"GHAR-V002",
 day:"15",
 month:"OCT",
 title:"Premium Independent House",
 location:"Sector 132, Noida",
 time:"04:00 PM",
 status:"pending"
},
{
 id:"GHAR-V003",
 day:"22",
 month:"SEP",
 title:"Modern Family Villa",
 location:"Greater Noida West",
 time:"02:30 PM",
 status:"completed"
}
];

function load(){
    try{
        const x=JSON.parse(localStorage.getItem("ghar_scheduled_visits"));
        return Array.isArray(x)?x:fallback;
    }catch(e){return fallback}
}

function render(filter="all"){
    const data=load().filter(x=>filter==="all"||x.status===filter);
    const el=document.getElementById("visitList");

    if(!data.length){
        el.innerHTML=`<div class="card" style="text-align:center;padding:50px">
        <h3>No visits found</h3>
        <p class="muted">There are no visits matching this filter.</p>
        <a class="btn primary" href="../property/property-search.html">Find Properties</a>
        </div>`;
        return;
    }

    el.innerHTML=data.map(x=>`
    <article class="card visit">
        <div class="date">
            <strong>${x.day||"--"}</strong>
            <span>${x.month||""}</span>
        </div>

        <div>
            <h3>${escape(x.title)}</h3>
            <div class="muted">📍 ${escape(x.location)}</div>
            <div class="muted">🕐 ${escape(x.time)}</div>
            <span class="status">${escape(x.status)}</span>
        </div>

        <div class="actions">
            <a class="btn primary" href="status.html?id=${encodeURIComponent(x.id)}">View Status</a>
            <a class="btn" href="reschedule.html?id=${encodeURIComponent(x.id)}">Reschedule</a>
        </div>
    </article>`).join("");
}

function escape(v){
    return String(v??"").replace(/[&<>"']/g,m=>({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
    }[m]));
}

document.addEventListener("DOMContentLoaded",()=>{
    render();

    document.querySelectorAll(".filter").forEach(btn=>{
        btn.onclick=()=>{
            document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));
            btn.classList.add("active");
            render(btn.dataset.filter);
        };
    });
});

})();
</script>
</body>
</html>
